appId: io.github.nhilaire.labyrinthe3d
name: First launch - consent in the phone language (French or English), guided game offer, then home (AC-01, AC-02)
tags:
  - smoke
---
- launchApp:
    clearState: true
# AC-01: consent screen in the phone language (French proven by DEVICE-CHECKS on a French app language), both buttons.
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 20000
- assertVisible: "Statistiques anonymes|Anonymous statistics"
- assertVisible:
    id: "consent-accept"
- assertVisible:
    id: "consent-refuse"
- takeScreenshot: 01-consent
- tapOn:
    id: "consent-refuse"
# AC-02: the guided game offer, then home.
- assertVisible:
    id: "guide-offer-screen"
- takeScreenshot: 02-guide-offer
- tapOn:
    id: "guide-offer-skip"
- runFlow: helpers/french.yaml
- assertVisible:
    id: "home-screen"
- takeScreenshot: readme-1-home
# Next launch: neither consent nor the offer.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 20000
- assertNotVisible:
    id: "consent-screen"
- assertNotVisible:
    id: "guide-offer-screen"
